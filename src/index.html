<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scry Player</title>
    <link rel="stylesheet" href="./styles/app.css" />
  </head>
  <body>
    <!-- Moonlight on water. Purely decorative. -->
    <canvas id="water" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand__moon" aria-hidden="true"></span>
          <h1 class="brand__name">Scry<span>Player</span></h1>
        </div>

        <nav class="picker" id="picker" role="tablist" aria-label="Media source">
          <span class="picker__glow" id="picker-glow" aria-hidden="true"></span>
          <button
            class="picker__opt"
            id="tab-local"
            role="tab"
            data-source="local"
            aria-controls="panel-local"
            aria-selected="true"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M4 6.5A1.5 1.5 0 0 1 5.5 5h3.9c.5 0 1 .24 1.25.66l.7 1.09c.14.21.37.34.62.34H18.5A1.5 1.5 0 0 1 20 8.6v8.9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"
              />
            </svg>
            <span>Local Files</span>
          </button>
          <button
            class="picker__opt"
            id="tab-youtube"
            role="tab"
            data-source="youtube"
            aria-controls="panel-youtube"
            aria-selected="false"
            tabindex="-1"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M21.6 7.2a2.5 2.5 0 0 0-1.75-1.77C18.28 5 12 5 12 5s-6.28 0-7.85.43A2.5 2.5 0 0 0 2.4 7.2C2 8.78 2 12 2 12s0 3.22.4 4.8a2.5 2.5 0 0 0 1.75 1.77C5.72 19 12 19 12 19s6.28 0 7.85-.43a2.5 2.5 0 0 0 1.75-1.77C22 15.22 22 12 22 12s0-3.22-.4-4.8M10 15.1V8.9l5.2 3.1z"
              />
            </svg>
            <span>YouTube</span>
          </button>
        </nav>

        <div class="topbar__end">
          <span class="status" id="status" role="status" aria-live="polite"></span>
        </div>
      </header>

      <main class="stage">
        <!-- ───────────── Local files ───────────── -->
        <section
          class="panel panel--local is-active"
          id="panel-local"
          role="tabpanel"
          aria-labelledby="tab-local"
        >
          <div class="pane pane--browser">
            <div class="pane__head">
              <h2 class="pane__title">Library</h2>
              <div class="pane__actions">
                <button class="btn btn--ghost" id="btn-pick-folder">Add folder…</button>
                <button class="btn btn--ghost" id="btn-pick-files">Add files…</button>
              </div>
            </div>
            <div class="shortcuts" id="shortcuts"></div>
            <nav class="crumbs" id="crumbs" aria-label="Folder path"></nav>
            <ul class="filelist" id="filelist"></ul>
          </div>

          <div class="pane pane--queue">
            <div class="pane__head">
              <h2 class="pane__title">Queue <span class="count" id="count-local">0</span></h2>
              <button class="btn btn--ghost btn--sm" id="btn-clear-local">Clear</button>
            </div>
            <ol class="queue" id="queue-local"></ol>
          </div>
        </section>

        <!-- ───────────── YouTube ───────────── -->
        <section
          class="panel panel--youtube"
          id="panel-youtube"
          role="tabpanel"
          aria-labelledby="tab-youtube"
          hidden
        >
          <div class="pane pane--video">
            <form class="yt-form" id="yt-form">
              <input
                class="yt-input"
                id="yt-input"
                type="text"
                autocomplete="off"
                spellcheck="false"
                placeholder="Paste a YouTube link, playlist, or video ID…"
                aria-label="YouTube link or video ID"
              />
              <button class="btn btn--solid" type="submit">Add</button>
            </form>
            <div class="video-frame">
              <div class="video-frame__inner"><div id="yt-mount"></div></div>
              <p class="video-frame__hint" id="yt-hint">
                Nothing cued. Paste a link above to begin.
              </p>
            </div>
          </div>

          <div class="pane pane--queue">
            <div class="pane__head">
              <h2 class="pane__title">Queue <span class="count" id="count-youtube">0</span></h2>
              <button class="btn btn--ghost btn--sm" id="btn-clear-youtube">Clear</button>
            </div>
            <ol class="queue" id="queue-youtube"></ol>
          </div>
        </section>
      </main>

      <!-- ───────────── Shared transport ───────────── -->
      <footer class="transport">
        <div class="np">
          <div class="np__art" id="np-art" aria-hidden="true"></div>
          <div class="np__meta">
            <div class="np__title" id="np-title">Nothing playing</div>
            <div class="np__sub" id="np-sub">Still water</div>
          </div>
        </div>

        <div class="controls">
          <div class="controls__row">
            <button class="iconbtn" id="btn-shuffle" title="Shuffle" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M17 4l4 3-4 3M17 14l4 3-4 3M3 7h4.5c1.4 0 2.2.7 3 1.8l4 5.4c.8 1.1 1.6 1.8 3 1.8H21M3 17h4.5c1.4 0 2.2-.7 3-1.8l.9-1.2M15.6 9.2l.9-1.2c.8-1.1 1.6-1.8 3-1.8H21"
                />
              </svg>
            </button>
            <button class="iconbtn" id="btn-prev" title="Previous">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M18 5v14L8 12zM6 5v14" />
              </svg>
            </button>
            <button class="playbtn" id="btn-play" title="Play" aria-label="Play">
              <svg class="playbtn__play" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 5.5v13l11-6.5z" />
              </svg>
              <svg class="playbtn__pause" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9 5.5v13M15 5.5v13" />
              </svg>
            </button>
            <button class="iconbtn" id="btn-next" title="Next">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 5v14l10-7zM18 5v14" />
              </svg>
            </button>
            <button class="iconbtn" id="btn-repeat" title="Repeat off" data-mode="off">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M17 2l4 4-4 4M7 22l-4-4 4-4" />
                <path d="M21 6H8a5 5 0 0 0-5 5v1M3 18h13a5 5 0 0 0 5-5v-1" />
              </svg>
              <span class="iconbtn__badge" id="repeat-badge">1</span>
            </button>
          </div>

          <div class="scrub">
            <span class="scrub__time" id="time-cur">0:00</span>
            <input
              class="range range--seek"
              id="seek"
              type="range"
              min="0"
              max="1000"
              value="0"
              step="1"
              aria-label="Seek"
            />
            <span class="scrub__time" id="time-dur">0:00</span>
          </div>
        </div>

        <div class="vol">
          <button class="iconbtn" id="btn-mute" title="Mute" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 9v6h4l5 4V5L8 9z" />
              <path class="vol__wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" />
              <path class="vol__cross" d="M16.5 9.5l5 5M21.5 9.5l-5 5" />
            </svg>
          </button>
          <input
            class="range range--vol"
            id="vol"
            type="range"
            min="0"
            max="100"
            value="80"
            step="1"
            aria-label="Volume"
          />
        </div>
      </footer>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>

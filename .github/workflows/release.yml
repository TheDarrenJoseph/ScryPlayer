name: Release

# Pushing a version tag (e.g. `v0.2.0`) builds the app for Linux and Windows
# and attaches the installers to a draft GitHub Release for that tag. A push
# to main alone does nothing — nothing ships until a tag says so, and the
# release is a draft until someone reviews and publishes it by hand.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # Keep this identical between the test and release jobs — cargo test
  # already needs everything the bundler does, minus AppImage's own
  # patchelf/xdg-utils, which only matter once tauri build actually
  # packages one up.
  LINUX_DEPS: >-
    libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev
    build-essential curl wget file libssl-dev libayatana-appindicator3-dev

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.LINUX_DEPS }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  release:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # AppImage + .deb cover the two formats asked for on Linux; `all`
          # would also produce an .rpm nobody requested.
          - platform: ubuntu-22.04
            bundles: appimage,deb
          # NSIS is Tauri's .exe-style installer, as opposed to the .msi
          # WiX produces — closer to what was asked for.
          - platform: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.LINUX_DEPS }} patchelf xdg-utils libfuse2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # linuxdeploy (fetched by the bundler to build the AppImage) is
          # itself an AppImage, and GitHub's Ubuntu runners have no FUSE to
          # mount it with. This has it extract and run instead — a no-op on
          # Windows, where nothing reads the variable.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Scry Player ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install this version.'
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }}
